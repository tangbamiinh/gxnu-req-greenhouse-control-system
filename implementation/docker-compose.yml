services:
  mongodb:
    image: mongo:latest
    container_name: greenhouse-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenhouse-backend
    ports:
      - "8002:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb

volumes:
  mongo-data:
